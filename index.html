<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
    }
    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 24px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-weight: 800;
      font-size: clamp(2rem, 7vw, 3.5rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #fff1b8 0%, #f6cf6e 50%, #e9a23b 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #f6cf6e;
    }
    .auth {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 20px;
    }
    .auth button {
      background: #000;
      border: 2px solid #e9a23b;
      border-radius: 2px;
      padding: 6px 14px;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(246, 207, 110, 0.25);
    }
    .auth button span {
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-weight: 700;
      font-size: clamp(0.8rem, 2vw, 1rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background-image: linear-gradient(180deg, #fff1b8 0%, #f6cf6e 50%, #e9a23b 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #f6cf6e;
    }
    .auth button:hover {
      border-color: #f6cf6e;
    }
  </style>
</head>
<body>
  <nav class="auth">
    <button type="button" id="loginBtn"><span>Login</span></button>
    <button type="button" id="signupBtn"><span>Sign up</span></button>
    <button type="button" id="logoutBtn" hidden><span>Sign out</span></button>
  </nav>
  <h1>Inventory</h1>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAoanjlkRmr0Nzcy5FcY6VuKq_MjYXmSqI",
      authDomain: "aotr-inventory.firebaseapp.com",
      projectId: "aotr-inventory",
      storageBucket: "aotr-inventory.firebasestorage.app",
      messagingSenderId: "250406485897",
      appId: "1:250406485897:web:8c669d84ed253ecc56eb58",
      measurementId: "G-4FZY4DLH7T"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    const loginBtn = document.getElementById("loginBtn");
    const signupBtn = document.getElementById("signupBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    async function googleSignIn() {
      try {
        await auth.signInWithPopup(provider);
      } catch (err) {
        if (err.code !== "auth/popup-closed-by-user" && err.code !== "auth/cancelled-popup-request") {
          alert("Sign-in failed: " + err.message);
        }
      }
    }

    loginBtn.addEventListener("click", () => {
      if (!auth.currentUser) googleSignIn();
    });
    signupBtn.addEventListener("click", googleSignIn);
    logoutBtn.addEventListener("click", () => auth.signOut());

    auth.onAuthStateChanged((user) => {
      if (user) {
        const name = (user.displayName || user.email || "Account").split(" ")[0];
        loginBtn.querySelector("span").textContent = name;
        signupBtn.hidden = true;
        logoutBtn.hidden = false;
      } else {
        loginBtn.querySelector("span").textContent = "Login";
        signupBtn.hidden = false;
        logoutBtn.hidden = true;
      }
    });
  </script>
</body>
</html>
