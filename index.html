<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      color: #1f2933;
    }
    main {
      text-align: center;
      padding: 0 16px;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      margin: 0 0 0.5rem;
    }
    p {
      font-size: 1.1rem;
      color: #52606d;
      margin: 0;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #121417; color: #f0f2f5; }
      p { color: #9aa5b1; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World!</h1>
    <p>Welcome to my first website.</p>
  </main>
</body>
</html>
