<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-light: #fff1b8;
      --gold: #f6cf6e;
      --gold-dark: #e9a23b;
    }
    [hidden] { display: none !important; }
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 24px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-weight: 800;
      font-size: clamp(2rem, 7vw, 3.5rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: var(--gold);
    }
    .gold-text {
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-weight: 700;
      font-size: clamp(0.8rem, 2vw, 1rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      background-image: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: var(--gold);
    }
    .box {
      background: #000;
      border: 2px solid var(--gold-dark);
      border-radius: 2px;
      padding: 6px 14px;
      box-shadow: inset 0 0 0 1px rgba(246, 207, 110, 0.25);
      font: inherit;
      cursor: pointer;
    }
    .box:hover {
      border-color: var(--gold);
    }
    input.box {
      cursor: text;
      color: var(--gold);
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-align: center;
      outline: none;
      min-width: 240px;
    }
    input.box::placeholder {
      color: rgba(246, 207, 110, 0.4);
    }
    .auth {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    .account {
      position: relative;
    }
    .dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      opacity: 0;
      transform: translateY(-8px) scale(0.96);
      transform-origin: top right;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    }
    .dropdown.open {
      opacity: 1;
      transform: none;
      visibility: visible;
      pointer-events: auto;
    }
    @media (prefers-reduced-motion: reduce) {
      .dropdown { transition: none; transform: none; }
    }
    .inventory {
      position: relative;
      width: min(94vw, 1100px);
      height: min(78vh, 820px);
      margin-top: 32px;
      padding: 24px;
      box-sizing: border-box;
      background: #000;
      border: 2px solid var(--gold-dark);
      box-shadow: inset 0 0 0 1px rgba(246, 207, 110, 0.25), 0 0 24px rgba(233, 162, 59, 0.15);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, 96px);
      justify-content: center;
      gap: 16px;
    }
    .slot {
      position: relative;
      width: 96px;
      height: 96px;
      box-sizing: border-box;
      background: linear-gradient(180deg, #161616 0%, #000 100%);
      border: 2px solid #f0b040;
      box-shadow: inset 0 0 0 1px rgba(246, 207, 110, 0.2);
    }
    .slot .count {
      position: absolute;
      right: 6px;
      bottom: 2px;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-size: 1rem;
      color: #fff1b8;
    }
    .add-slot {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 120px;
      height: 120px;
      box-sizing: border-box;
      padding: 0;
      cursor: pointer;
      background: linear-gradient(180deg, #1a1a1a 0%, #000 100%);
      border: 3px solid #f0b040;
      color: #fff;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-size: 3rem;
      line-height: 1;
    }
    .add-slot:hover {
      border-color: var(--gold-light);
    }
    .search-box {
      width: min(92vw, 520px);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px;
      box-sizing: border-box;
      background: #000;
      border: 2px solid var(--gold-dark);
      box-shadow: inset 0 0 0 1px rgba(246, 207, 110, 0.25), 0 0 24px rgba(233, 162, 59, 0.15);
    }
    input.search-input {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      text-align: left;
      font-size: 1rem;
    }
    .results {
      flex: 1;
      min-height: 120px;
      overflow-y: auto;
    }
    .empty {
      margin: 32px 0;
      text-align: center;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      color: rgba(246, 207, 110, 0.6);
    }
    .item-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 4px;
      border-bottom: 1px solid rgba(246, 207, 110, 0.15);
    }
    .item-slot {
      flex: 0 0 56px;
      height: 56px;
      box-sizing: border-box;
      background: linear-gradient(180deg, #161616 0%, #000 100%);
      border: 2px solid #f0b040;
    }
    .item-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .item-info .gold-text {
      white-space: normal;
      font-size: 0.9rem;
    }
    .item-info small {
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-size: 0.8rem;
      color: rgba(246, 207, 110, 0.7);
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
    }
    .panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .error {
      margin: 0;
      min-height: 1.2em;
      color: #e0655c;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <nav class="auth">
    <button type="button" id="loginBtn" class="box"><span class="gold-text">Login</span></button>
    <button type="button" id="signupBtn" class="box"><span class="gold-text">Sign up</span></button>
    <div class="account" id="account" hidden>
      <button type="button" id="accountBtn" class="box" aria-haspopup="true"><span class="gold-text">Account</span></button>
      <div class="dropdown" id="dropdown">
        <button type="button" id="logoutBtn" class="box"><span class="gold-text">Sign out</span></button>
      </div>
    </div>
  </nav>

  <h1>Inventory</h1>

  <section class="inventory" aria-label="Inventory">
    <button type="button" id="addBtn" class="add-slot" aria-label="Add item">+</button>
  </section>

  <div class="overlay" id="searchOverlay" hidden>
    <div class="search-box" role="dialog" aria-modal="true" aria-label="Search items">
      <input class="box search-input" id="searchInput" type="search" placeholder="Search items">
      <div class="results" id="results"></div>
    </div>
  </div>

  <div class="overlay" id="usernameOverlay" hidden>
    <form class="panel" id="usernameForm" autocomplete="off">
      <span class="gold-text">Choose a username</span>
      <input class="box" id="usernameInput" type="text" maxlength="20" placeholder="username" required>
      <p class="error" id="usernameError"></p>
      <button type="submit" class="box"><span class="gold-text">Save</span></button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAoanjlkRmr0Nzcy5FcY6VuKq_MjYXmSqI",
      authDomain: "aotr-inventory.firebaseapp.com",
      projectId: "aotr-inventory",
      storageBucket: "aotr-inventory.firebasestorage.app",
      messagingSenderId: "250406485897",
      appId: "1:250406485897:web:8c669d84ed253ecc56eb58",
      measurementId: "G-4FZY4DLH7T"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const provider = new firebase.auth.GoogleAuthProvider();

    const $ = (id) => document.getElementById(id);
    const loginBtn = $("loginBtn");
    const signupBtn = $("signupBtn");
    const account = $("account");
    const accountBtn = $("accountBtn");
    const dropdown = $("dropdown");
    const logoutBtn = $("logoutBtn");
    const overlay = $("usernameOverlay");
    const form = $("usernameForm");
    const input = $("usernameInput");
    const errorEl = $("usernameError");

    function setLabel(btn, text) {
      btn.querySelector(".gold-text").textContent = text;
    }

    async function googleSignIn() {
      try {
        await auth.signInWithPopup(provider);
      } catch (err) {
        if (!["auth/popup-closed-by-user", "auth/cancelled-popup-request"].includes(err.code)) {
          alert("Sign-in failed: " + err.message);
        }
      }
    }

    loginBtn.addEventListener("click", googleSignIn);
    signupBtn.addEventListener("click", googleSignIn);

    accountBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      dropdown.classList.toggle("open");
    });
    document.addEventListener("click", (e) => {
      if (!account.contains(e.target)) dropdown.classList.remove("open");
    });
    logoutBtn.addEventListener("click", () => {
      dropdown.classList.remove("open");
      auth.signOut();
    });

    function showUsernamePrompt() {
      overlay.hidden = false;
      errorEl.textContent = "";
      input.value = "";
      input.focus();
    }

    function hideUsernamePrompt() {
      overlay.hidden = true;
    }

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        loginBtn.hidden = true;
        signupBtn.hidden = true;
        account.hidden = false;
        setLabel(accountBtn, "Loading");
        try {
          const snap = await db.collection("users").doc(user.uid).get();
          if (snap.exists && snap.data().username) {
            setLabel(accountBtn, snap.data().username);
            hideUsernamePrompt();
          } else {
            setLabel(accountBtn, (user.displayName || user.email || "Account").split(" ")[0]);
            showUsernamePrompt();
          }
        } catch (err) {
          alert("Could not load your account: " + err.message);
        }
      } else {
        loginBtn.hidden = false;
        signupBtn.hidden = false;
        account.hidden = true;
        dropdown.classList.remove("open");
        hideUsernamePrompt();
      }
    });

    const addBtn = $("addBtn");
    const searchOverlay = $("searchOverlay");
    const searchInput = $("searchInput");

    const items = [
      { name: "Monarch's Aura", rarity: "Divine", value: "O/C" },
      { name: "Kamish's Wrath (R)", rarity: "Mythic", value: "O/C" },
      { name: "Kamish's Wrath (L)", rarity: "Mythic", value: "O/C" },
      { name: "Sung Dripwoo's Attire", rarity: "Mythic", value: "O/C" },
      { name: "Third Eye", rarity: "Divine", value: "1.2M" },
      { name: "Vulcan's Grace", rarity: "Divine", value: "574K" },
      { name: "Eclipse", rarity: "Mythic", value: "473K" },
      { name: "Ad Astra", rarity: "Mythic", value: "176K" },
      { name: "Seraphic", rarity: "Legendary", value: "96.8K" },
      { name: "Matrix", rarity: "Legendary", value: "74.3K" },
      { name: "Toji's Attire", rarity: "Legendary", value: "45.9K" },
      { name: "Ulquiorra's Wings", rarity: "Legendary", value: "40K" },
      { name: "Bambietta's Wings", rarity: "Legendary", value: "37.8K" },
      { name: "Zangetsu", rarity: "Legendary", value: "22.5K" },
      { name: "Primera's Attire", rarity: "Legendary", value: "16.2K" },
      { name: "Black Flash", rarity: "Legendary", value: "10.8K" },
      { name: "Cursed Markings", rarity: "Legendary", value: "7.2K" },
      { name: "Mahoraga's Wheel", rarity: "Epic", value: "6.3K" }
    ];
    const results = $("results");

    function renderResults() {
      const q = searchInput.value.trim().toLowerCase();
      const matches = items.filter((it) => it.name.toLowerCase().includes(q));
      results.innerHTML = "";
      if (matches.length === 0) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "No items found.";
        results.appendChild(p);
        return;
      }
      for (const it of matches) {
        const row = document.createElement("div");
        row.className = "item-row";
        const slot = document.createElement("div");
        slot.className = "item-slot";
        const info = document.createElement("div");
        info.className = "item-info";
        const name = document.createElement("span");
        name.className = "gold-text";
        name.textContent = it.name;
        const meta = document.createElement("small");
        meta.textContent = it.rarity + "  ·  Value: " + it.value;
        info.append(name, meta);
        row.append(slot, info);
        results.appendChild(row);
      }
    }

    addBtn.addEventListener("click", () => {
      searchOverlay.hidden = false;
      searchInput.value = "";
      renderResults();
      searchInput.focus();
    });
    searchInput.addEventListener("input", renderResults);
    searchOverlay.addEventListener("click", (e) => {
      if (e.target === searchOverlay) searchOverlay.hidden = true;
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") searchOverlay.hidden = true;
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) return;

      const username = input.value.trim();
      const key = username.toLowerCase();
      if (!/^[a-z0-9_]{3,20}$/.test(key)) {
        errorEl.textContent = "Use 3 to 20 letters, numbers or underscores.";
        return;
      }
      errorEl.textContent = "";

      try {
        await db.runTransaction(async (tx) => {
          const nameRef = db.collection("usernames").doc(key);
          const userRef = db.collection("users").doc(user.uid);
          const nameSnap = await tx.get(nameRef);
          if (nameSnap.exists) {
            throw new Error("That username is already taken.");
          }
          tx.set(nameRef, { uid: user.uid });
          tx.set(userRef, { username: username, usernameKey: key }, { merge: true });
        });
        setLabel(accountBtn, username);
        hideUsernamePrompt();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
