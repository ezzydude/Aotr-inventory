<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-light: #fff1b8;
      --gold: #f6cf6e;
      --gold-dark: #e9a23b;
    }
    [hidden] { display: none !important; }
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 24px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-weight: 800;
      font-size: clamp(2rem, 7vw, 3.5rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: var(--gold);
    }
    .gold-text {
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-weight: 700;
      font-size: clamp(0.8rem, 2vw, 1rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      background-image: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: var(--gold);
    }
    .box {
      background: #000;
      border: 2px solid var(--gold-dark);
      border-radius: 2px;
      padding: 6px 14px;
      box-shadow: inset 0 0 0 1px rgba(246, 207, 110, 0.25);
      font: inherit;
      cursor: pointer;
    }
    .box:hover {
      border-color: var(--gold);
    }
    input.box {
      cursor: text;
      color: var(--gold);
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-align: center;
      outline: none;
      min-width: 240px;
    }
    input.box::placeholder {
      color: rgba(246, 207, 110, 0.4);
    }
    .auth {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    .account {
      position: relative;
    }
    .dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      opacity: 0;
      transform: translateY(-8px) scale(0.96);
      transform-origin: top right;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    }
    .dropdown.open {
      opacity: 1;
      transform: none;
      visibility: visible;
      pointer-events: auto;
    }
    @media (prefers-reduced-motion: reduce) {
      .dropdown { transition: none; transform: none; }
    }
    .inventory {
      display: grid;
      grid-template-columns: repeat(auto-fill, var(--cell));
      justify-content: center;
      align-content: start;
      gap: 16px;
      overflow-y: auto;
      width: min(94vw, 1100px);
      height: min(78vh, 820px);
      margin-top: 12px;
      padding: 24px;
      box-sizing: border-box;
      background: #000;
      border: 2px solid var(--gold-dark);
      box-shadow: inset 0 0 0 1px rgba(246, 207, 110, 0.25), 0 0 24px rgba(233, 162, 59, 0.15);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, 96px);
      justify-content: center;
      gap: 16px;
    }
    .slot {
      position: relative;
      width: 96px;
      height: 96px;
      box-sizing: border-box;
      background: linear-gradient(180deg, #161616 0%, #000 100%);
      border: 2px solid #f0b040;
      box-shadow: inset 0 0 0 1px rgba(246, 207, 110, 0.2);
    }
    .slot .count {
      position: absolute;
      right: 6px;
      bottom: 2px;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-size: 1rem;
      color: #fff1b8;
    }
    .add-slot {
      width: 96px;
      height: 96px;
      box-sizing: border-box;
      padding: 0;
      cursor: pointer;
      background: linear-gradient(180deg, #1a1a1a 0%, #000 100%);
      border: 3px solid #f0b040;
      color: #fff;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-size: 3rem;
      line-height: 1;
    }
    .add-slot:hover {
      border-color: var(--gold-light);
    }
    .search-box {
      width: min(92vw, 520px);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px;
      box-sizing: border-box;
      background: #000;
      border: 2px solid var(--gold-dark);
      box-shadow: inset 0 0 0 1px rgba(246, 207, 110, 0.25), 0 0 24px rgba(233, 162, 59, 0.15);
    }
    input.search-input {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      text-align: left;
      font-size: 1rem;
    }
    .results {
      flex: 1;
      min-height: 120px;
      overflow-y: auto;
    }
    .empty {
      margin: 32px 0;
      text-align: center;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      color: rgba(246, 207, 110, 0.6);
    }
    .slot .item-label {
      position: absolute;
      top: 4px;
      left: 4px;
      right: 4px;
      bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      text-align: center;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-size: 0.65rem;
      line-height: 1.1;
      color: var(--gold);
      overflow: hidden;
      word-break: break-word;
    }
    .item-row {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 4px;
      border-bottom: 1px solid rgba(246, 207, 110, 0.15);
    }
    .item-slot {
      flex: 0 0 56px;
      height: 56px;
      box-sizing: border-box;
      background: linear-gradient(180deg, #161616 0%, #000 100%);
      border: 2px solid #f0b040;
    }
    .item-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .item-info .gold-text {
      white-space: normal;
      font-size: 0.9rem;
    }
    .item-info small {
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-size: 0.8rem;
      color: rgba(246, 207, 110, 0.7);
    }
    .currency-bar {
      width: min(94vw, 1100px);
      margin-top: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-sizing: border-box;
    }
    .total {
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-weight: 700;
      font-size: clamp(0.8rem, 2vw, 1rem);
      letter-spacing: 0.04em;
      color: var(--gold);
    }
    .currency {
      position: relative;
    }
    .currency-menu {
      position: absolute;
      bottom: calc(100% + 8px);
      right: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      opacity: 0;
      transform: translateY(8px) scale(0.96);
      transform-origin: bottom right;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    }
    .currency-menu.open {
      opacity: 1;
      transform: none;
      visibility: visible;
      pointer-events: auto;
    }
    .currency-menu .box {
      min-width: 120px;
    }
    .currency-menu .box.selected {
      border-color: var(--gold-light);
    }
    .slot .item-value {
      position: absolute;
      left: 4px;
      bottom: 3px;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-size: 0.65rem;
      color: #fff1b8;
    }
    .edit-box {
      width: min(92vw, 360px);
      box-sizing: border-box;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: #000;
      border: 2px solid var(--gold-dark);
      box-shadow: inset 0 0 0 1px rgba(246, 207, 110, 0.25), 0 0 24px rgba(233, 162, 59, 0.15);
    }
    .edit-value {
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      color: rgba(246, 207, 110, 0.7);
    }
    .edit-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    input.edit-qty {
      min-width: 0;
      width: 120px;
    }
    .edit-actions {
      display: flex;
      gap: 16px;
    }
    :root {
      --cell: 96px;
    }
    .add-slot {
      width: var(--cell);
      height: var(--cell);
    }
    .inv-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: var(--cell);
    }
    .inv-card .slot {
      width: 100%;
      height: var(--cell);
      cursor: pointer;
    }
    .qty {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .qty .box {
      padding: 2px 8px;
      line-height: 1;
    }
    input.qty-input {
      min-width: 0;
      width: 48px;
      padding: 2px 4px;
      text-align: center;
      font-size: 0.9rem;
    }
    @media (max-width: 600px) {
      :root {
        --cell: 80px;
      }
      body {
        padding-top: 12px;
      }
      .auth {
        position: static;
        align-self: flex-end;
        margin: 0 12px;
      }
      .inventory {
        height: auto;
        min-height: 50vh;
        padding: 16px;
        gap: 12px;
      }
      .currency-bar {
        margin-top: 16px;
        width: 94vw;
      }
      .total {
        font-size: 0.8rem;
      }
      input.qty-input {
        width: 40px;
      }
      .qty .box {
        padding: 2px 6px;
      }
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
    }
    .panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .error {
      margin: 0;
      min-height: 1.2em;
      color: #e0655c;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <nav class="auth">
    <button type="button" id="loginBtn" class="box"><span class="gold-text">Login</span></button>
    <button type="button" id="signupBtn" class="box"><span class="gold-text">Sign up</span></button>
    <div class="account" id="account" hidden>
      <button type="button" id="accountBtn" class="box" aria-haspopup="true"><span class="gold-text">Account</span></button>
      <div class="dropdown" id="dropdown">
        <button type="button" id="logoutBtn" class="box"><span class="gold-text">Sign out</span></button>
      </div>
    </div>
  </nav>

  <h1>Inventory</h1>

  <div class="currency-bar">
    <span class="total" id="total"></span>
    <div class="currency" id="currency">
      <div class="currency-menu" id="currencyMenu">
        <button type="button" class="box" data-currency="keys"><span class="gold-text">Keys</span></button>
        <button type="button" class="box" data-currency="scrolls"><span class="gold-text">Scrolls</span></button>
        <button type="button" class="box" data-currency="viz"><span class="gold-text">Viz</span></button>
      </div>
      <button type="button" class="box" id="currencyBtn" aria-haspopup="true"><span class="gold-text">Keys</span></button>
    </div>
  </div>

  <section class="inventory" id="inventory" aria-label="Inventory">
    <button type="button" id="addBtn" class="add-slot" aria-label="Add item">+</button>
  </section>

  <div class="overlay" id="searchOverlay" hidden>
    <div class="search-box" role="dialog" aria-modal="true" aria-label="Search items">
      <input class="box search-input" id="searchInput" type="search" placeholder="Search items">
      <div class="results" id="results"></div>
    </div>
  </div>

  <div class="overlay" id="usernameOverlay" hidden>
    <form class="panel" id="usernameForm" autocomplete="off">
      <span class="gold-text">Choose a username</span>
      <input class="box" id="usernameInput" type="text" maxlength="20" placeholder="username" required>
      <p class="error" id="usernameError"></p>
      <button type="submit" class="box"><span class="gold-text">Save</span></button>
    </form>
  </div>

  <div class="overlay" id="editOverlay" hidden>
    <div class="edit-box" role="dialog" aria-modal="true" aria-label="Edit item">
      <span class="gold-text" id="editName"></span>
      <span class="edit-value" id="editValue"></span>
      <label class="edit-label">
        <span class="gold-text">Quantity</span>
        <input class="box edit-qty" id="editQty" type="number" min="0" step="1">
      </label>
      <div class="edit-actions">
        <button type="button" class="box" id="editSave"><span class="gold-text">Save</span></button>
        <button type="button" class="box" id="editRemove"><span class="gold-text">Remove</span></button>
      </div>
    </div>
  </div>

      try {

        if (!["auth/popup-closed-by-user", "auth/cancelled-popup-request"].includes(err.code)) {

      dropdown.classList.remove("open");
      auth.signOut();

    function showUsernamePrompt() {
      overlay.hidden = false;

      input.value = "";

    function hideUsernamePrompt() {
      overlay.hidden = true;

      if (user) {
        loginBtn.hidden = true;
        signupBtn.hidden = true;
        account.hidden = false;
        setLabel(accountBtn, "Loading");
        try {
          const snap = await db.collection("users").doc(user.uid).get();
          if (snap.exists && snap.data().username) {
            setLabel(accountBtn, snap.data().username);
            hideUsernamePrompt();
          } else {
            setLabel(accountBtn, (user.displayName || user.email || "Account").split(" ")[0]);

    items.push(...more.map(([name, rarity, value]) => ({ name, rarity, value })));

    const results = $("results");

    const currencies = {
      keys: { label: "Keys", perKey: 1 },
      scrolls: { label: "Scrolls", perKey: 1 / 3 },
      viz: { label: "Viz", perKey: 1 / 900 }
    };
    let currency = "keys";

    function parseKeys(v) {
      const m = String(v).trim().match(/^([\d.]+)\s*([KMB]?)$/i);
      if (!m) return null;
      const mult = { K: 1e3, M: 1e6, B: 1e9 }[m[2].toUpperCase()] || 1;
      return parseFloat(m[1]) * mult;
    }

    function trimNum(x, digits) {
      return String(parseFloat(x.toFixed(digits)));
    }

    function formatNum(n) {
      for (const [unit, suffix] of [[1e9, "B"], [1e6, "M"], [1e3, "K"]]) {
        if (Math.abs(n) >= unit) return trimNum(n / unit, 2) + suffix;
      }
      return trimNum(n, n >= 1 ? 2 : 4);
    }

    function displayValue(item, qty = 1) {
      const n = parseKeys(item.value);
      if (n === null) return item.value;
      return formatNum(n * qty * currencies[currency].perKey);
    }

    const RARITY_COLORS = {
      common: "#d0d0d0",
      uncommon: "#5fd35f",
      rare: "#3fa9ff",
      epic: "#b26bff",
      legendary: "#f5b642",
      mythic: "#ff4d4d",
      divine: "#9ef0ff",
      event: "#ff8c42"
    };

    function rarityColor(rarity) {
      return RARITY_COLORS[String(rarity).toLowerCase()] || "#f0b040";
    }

    const totalEl = $("total");

    function updateTotal() {
      let total = 0;
      for (const { item, count } of inventoryCounts.values()) {
        const n = parseKeys(item.value);
        if (n !== null) total += n * count * currencies[currency].perKey;
      }
      totalEl.textContent = "Total: " + formatNum(total) + " " + currencies[currency].label;
    }

    const inventoryEl = $("inventory");
    const inventoryCounts = new Map();

    function setQty(name, qty) {
      if (!Number.isFinite(qty) || qty < 1) {
        inventoryCounts.delete(name);
      } else {
        const entry = inventoryCounts.get(name);
        if (entry) entry.count = Math.min(qty, 999);
      }
      renderInventory();
    }

    function renderInventory() {
      inventoryEl.querySelectorAll(".inv-card").forEach((el) => el.remove());
      for (const { item, count } of inventoryCounts.values()) {
        const card = document.createElement("div");
        card.className = "inv-card";

        const slot = document.createElement("div");
        slot.className = "slot item";
        slot.style.borderColor = rarityColor(item.rarity);
        slot.title = item.name + " (" + item.rarity + ")";
        const label = document.createElement("span");
        label.className = "item-label";
        label.textContent = item.name;
        const valueEl = document.createElement("span");
        valueEl.className = "item-value";
        valueEl.textContent = displayValue(item, count);
        slot.append(label, valueEl);
        slot.addEventListener("click", () => openEditor(item.name));

        const qty = document.createElement("div");
        qty.className = "qty";
        const minus = document.createElement("button");
        minus.type = "button";
        minus.className = "box";
        minus.setAttribute("aria-label", "Decrease quantity");
        minus.innerHTML = '<span class="gold-text">−</span>';
        const input = document.createElement("input");
        input.className = "box qty-input";
        input.type = "number";
        input.min = "0";
        input.step = "1";
        input.value = count;
        input.setAttribute("aria-label", "Quantity");
        const plus = document.createElement("button");
        plus.type = "button";
        plus.className = "box";
        plus.setAttribute("aria-label", "Increase quantity");
        plus.innerHTML = '<span class="gold-text">+</span>';

        minus.addEventListener("click", () => setQty(item.name, count - 1));
        plus.addEventListener("click", () => setQty(item.name, count + 1));
        input.addEventListener("change", () => {
          if (input.value !== "") setQty(item.name, Math.floor(Number(input.value)));
        });

        qty.append(minus, input, plus);
        card.append(slot, qty);
        inventoryEl.appendChild(card);
      }
      updateTotal();
    }

    function addToInventory(item) {
      const entry = inventoryCounts.get(item.name) || { item, count: 0 };
      entry.count += 1;
      inventoryCounts.set(item.name, entry);
      renderInventory();
      searchOverlay.hidden = true;
    }

    function renderResults() {
      const q = searchInput.value.trim().toLowerCase();
      const matches = items.filter((it) => it.name.toLowerCase().includes(q));
      results.innerHTML = "";
      if (matches.length === 0) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "No items found.";
        results.appendChild(p);
        return;
      }
      for (const it of matches) {
        const row = document.createElement("div");
        row.className = "item-row";
        row.addEventListener("click", () => addToInventory(it));
        const slot = document.createElement("div");
        slot.className = "item-slot";
        slot.style.borderColor = rarityColor(it.rarity);
        const info = document.createElement("div");
        info.className = "item-info";
        const name = document.createElement("span");
        name.className = "gold-text";
        name.textContent = it.name;
        const meta = document.createElement("small");
        meta.textContent = it.rarity + "  ·  Value: " + displayValue(it);
        meta.style.color = rarityColor(it.rarity);
        info.append(name, meta);
        row.append(slot, info);
        results.appendChild(row);
      }
    }

    addBtn.addEventListener("click", () => {
      searchOverlay.hidden = false;
      searchInput.value = "";
      renderResults();
      searchInput.focus();
    });
    searchInput.addEventListener("input", renderResults);
    searchOverlay.addEventListener("click", (e) => {
      if (e.target === searchOverlay) searchOverlay.hidden = true;
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") searchOverlay.hidden = true;
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) return;

      const username = input.value.trim();
      const key = username.toLowerCase();
      if (!/^[a-z0-9_]{3,20}$/.test(key)) {
        errorEl.textContent = "Use 3 to 20 letters, numbers or underscores.";
        return;
      }
      errorEl.textContent = "";

      try {
        await db.runTransaction(async (tx) => {
          const nameRef = db.collection("usernames").doc(key);
          const userRef = db.collection("users").doc(user.uid);
          const nameSnap = await tx.get(nameRef);
          if (nameSnap.exists) {
            throw new Error("That username is already taken.");
          }
          tx.set(nameRef, { uid: user.uid });
          tx.set(userRef, { username: username, usernameKey: key }, { merge: true });
        });
        setLabel(accountBtn, username);
        hideUsernamePrompt();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
    const currencyBtn = $("currencyBtn");
    const currencyMenu = $("currencyMenu");
    const currencyWrap = $("currency");
    const editOverlay = $("editOverlay");
    const editName = $("editName");
    const editValue = $("editValue");
    const editQty = $("editQty");
    let editingName = null;

    function setCurrency(key) {
      currency = key;
      setLabel(currencyBtn, currencies[key].label);
      currencyMenu.querySelectorAll("button").forEach((b) => {
        b.classList.toggle("selected", b.dataset.currency === key);
      });
      currencyMenu.classList.remove("open");
      renderInventory();
      if (!searchOverlay.hidden) renderResults();
    }

    currencyBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      currencyMenu.classList.toggle("open");
    });
    currencyMenu.querySelectorAll("button").forEach((b) => {
      b.addEventListener("click", (e) => {
        e.stopPropagation();
        setCurrency(b.dataset.currency);
      });
    });
    document.addEventListener("click", (e) => {
      if (!currencyWrap.contains(e.target)) currencyMenu.classList.remove("open");
    });
    setCurrency("keys");

    function openEditor(name) {
      const entry = inventoryCounts.get(name);
      if (!entry) return;
      editingName = name;
      editName.textContent = entry.item.name;
      editValue.textContent = "Value: " + displayValue(entry.item, entry.count);
      editQty.value = entry.count;
      editOverlay.hidden = false;
      editQty.focus();
      editQty.select();
    }

    function closeEditor() {
      editOverlay.hidden = true;
      editingName = null;
    }

    function removeItem(name) {
      inventoryCounts.delete(name);
      renderInventory();
    }

    $("editSave").addEventListener("click", () => {
      if (editingName === null) return;
      const qty = Math.floor(Number(editQty.value));
      if (!Number.isFinite(qty) || qty < 1) {
        removeItem(editingName);
      } else {
        inventoryCounts.get(editingName).count = qty;
        renderInventory();
      }
      closeEditor();
    });
    $("editRemove").addEventListener("click", () => {
      if (editingName !== null) removeItem(editingName);
      closeEditor();
    });
    editOverlay.addEventListener("click", (e) => {
      if (e.target === editOverlay) closeEditor();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeEditor();
    });
