<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
    }
    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 24px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-weight: 800;
      font-size: clamp(2rem, 7vw, 3.5rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #fff1b8 0%, #f6cf6e 50%, #e9a23b 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #f6cf6e;
    }
    .auth {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 20px;
    }
    .auth button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-weight: 700;
      font-size: clamp(0.8rem, 2vw, 1rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background-image: linear-gradient(180deg, #fff1b8 0%, #f6cf6e 50%, #e9a23b 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #f6cf6e;
    }
    .auth button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <nav class="auth">
    <button type="button">Login</button>
    <button type="button">Sign up</button>
  </nav>
  <h1>Inventory</h1>
</body>
</html>
